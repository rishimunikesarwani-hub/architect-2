<title id="title">Architect 2.0 engineering map</title><desc id="desc">Current React prototype, browser demo storage, isolated iframe, Better Auth and Convex owner-scoped backend. Google credentials are pending. Build, GitHub, deployment and multiplayer permission review are simulations. Shared project membership and protected cross-team agent reuse are future proposals.</desc>
